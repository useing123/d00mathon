id: freedom_chat_v1
name: Freedom Broker — чат с оператором v1
channel: chat
description: Оценка работы ОПЕРАТОРА (человека) в чате. Реплики бота и системные сообщения не оцениваются.
assumptions:
  rounding: half_up        # half_up (Decimal ROUND_HALF_UP) | bankers
  decimals: 2
  first_reply: first_human_operator_turn   # «первая реплика» = первая реплика ЧЕЛОВЕКА-оператора, даже если бот отвечал раньше
  ignore_internal_hold_turns: true          # реплики во время удержания/консультации между агентами не оцениваются
  self_consistency_samples: 3               # только в режиме одной модели (CQA_ENSEMBLE=0): доп. сэмплы при низкой уверенности; в режиме жюри не используется
  confidence_threshold: 0.8                 # порог уверенности для доп. сэмплов (только режим одной модели)
criteria:
  - id: "01"
    name: Установление контакта
    type: binary
    weight: 10
    allow_na: false
    rubric: |
      YES — в своей ПЕРВОЙ реплике оператор (speaker=operator) поздоровался на языке клиента И представился (назвал имя).
      NO — нет приветствия, или нет представления, или приветствие не на языке клиента, или представился только в более поздней реплике.
    rules: |
      - «Первая реплика» = первая реплика ЧЕЛОВЕКА-оператора (speaker=operator), даже если бот отвечал раньше. Приветствие бота НЕ засчитывается.
      - Язык клиента определяется по сообщениям клиента (RU/KZ/EN). Если клиент пишет по-казахски, а оператор здоровается по-русски — NO. Смешанное приветствие, где есть язык клиента, — YES.
      - «Представился» = назвал своё имя (или имя + компания): «Меня зовут Алия», «На связи Алия», «Вас консультирует Алия», «Менің атым Алия», «Alia here». Только название компании без имени — NO.
      - Язык клиента — по его собственным сообщениям; если клиент писал только служебное («оператор», цифры), используй язык метаданных диалога. В блоке ФАКТЫ есть эвристика языка — сверяйся с текстом. Если клиент смешивает казахский и русский (например, здоровается по-казахски, а спрашивает по-русски), приветствие на любом из этих языков (или на обоих) — YES.
      - Оценивай ровно первую реплику оператора (если первая реплика разбита на 2 сообщения подряд без ответа клиента между ними — считай их вместе).
  - id: "02"
    name: Выявление потребности
    type: binary
    weight: 15
    allow_na: true
    rubric: |
      YES — оператор учёл уже известные из диалога детали (не переспрашивал то, что клиент уже сказал боту/оператору) и уточнил недостающие детали ПЕРЕД тем, как ответить.
      NO — оператор ответил «наугад», не уточнив существенно недостающие данные; или заставил клиента повторять уже сказанное; или проигнорировал ключевые детали запроса.
      NA — с самого начала данных было достаточно для ответа, уточнять ничего не требовалось, и оператор не переспрашивал лишнего.
    rules: |
      - NA — запрос с самого начала ясен и на него можно ответить без уточнений (оператор сразу корректно ответил, не переспрашивая). Не ставь YES за отсутствие проблем — это NA.
      - YES — оператор задал НУЖНОЕ уточнение (какой счёт/бумага/приложение/дата и т.п.) до ответа ИЛИ явно использовал уже известные детали — сослался в ответе на то, что клиент сообщил раньше (сумма, дата, тип счёта, название бумаги, «вижу, вы писали боту, что…»). Если клиент ушёл, не ответив на уточнение, — оператор всё равно уточнил: YES.
      - Приоритет YES/NA: YES — если для правильного ответа оператору НЕ хватало данных из последнего сообщения клиента и он их получил (спросил ИЛИ взял из переписки с ботом/предыдущих реплик вместо повторного вопроса). NA — если всё нужное было в самом запросе и уточнять было нечего; простое повторение деталей из запроса в ответе — это NA, не YES.
      - Если клиент сообщил боту лишь общую тему («проблема с выводом»), а оператор уточнил конкретику (сумму, дату, банк) — YES (нужное уточнение), а не избыточный переспрос.
      - Критерий оценивает ТОЛЬКО этап до ответа: хватало ли оператору данных и уточнил ли он недостающее. Пропущенные вопросы, неполный, неверный или неуместный ответ оцениваются в 04/08, а НЕ здесь: если данных клиента хватало для ответа — NA, даже если сам ответ плохой.
      - NO — нужное уточнение не задано и ответ дан «мимо»/наугад; ИЛИ оператор избыточно переспросил то, что клиент уже явно сообщил (боту или ранее).
      - Просьба назвать идентификационные данные сама по себе — это критерий 03, не 02.
  - id: "03"
    name: Идентификация
    type: binary
    weight: 20
    allow_na: true
    rubric: |
      YES — запрос требовал идентификации (раскрытие персональных/счётных данных клиента: баланс, сделки, статус заявки/вывода, данные счёта; или защищённое действие: смена данных, блокировка, вывод, сброс пароля и т.п.), и оператор подтвердил личность ДО раскрытия данных/действия.
      NO — идентификация требовалась, но не была проведена или проведена после раскрытия данных; или в чате не видно подтверждения личности.
      NA — запрос не требовал идентификации (общие вопросы: тарифы, где найти раздел, как работает функция, общие инструкции).
    rules: |
      - Идентификация = оператор запросил и получил/проверил идентифицирующие данные (ФИО, ИИН, номер счёта/договора, кодовое слово, телефон, дата рождения и т.п.) и это видно в чате; или в системе явно указано, что клиент авторизован/верифицирован.
      - Общая инструкция «зайдите в кабинет и посмотрите» не раскрывает данных — идентификация не нужна (NA).
      - Если оператор раскрывает конкретные данные клиента (суммы, статусы, даты операций его счёта) без видимой проверки — NO.
      - Если клиент САМ назвал ФИО/ИИН/номер счёта, но оператор не провёл проверку (кодовое слово, SMS, сверка данных) и раскрыл данные — NO. Вопрос об общей ошибке приложения без доступа к счёту — NA.
      - Если в блоке ФАКТЫ указано, что система/бот сообщает об авторизации клиента, — это подтверждённая идентификация.
      - Если запрос требовал идентификации и оператор её провёл (запросил и получил данные), а данные затем не раскрывались, потому что диалог закончился или был эскалирован, — YES.
  - id: "04"
    name: Консультация
    type: scale
    request_ledger: true
    scale: [0, 5, 10, 15, 20]
    weight: 20
    allow_na: true
    rubric: |
      20 — все существенные вопросы клиента закрыты, ИЛИ дан корректный следующий шаг (эскалация, заявка, точная инструкция).
      15 — основной вопрос решён, но упущена второстепенная деталь.
      10 — часть вопросов закрыта, но существенный вопрос остался открытым.
      5 — дана лишь общая подсказка, клиенту неясно, как действовать дальше.
      0 — нет содержательного ответа, или ключевая рекомендация неверна.
      NA — диалог прервался до того, как клиент сформулировал запрос.
    rules: |
      - Оценивай вклад ОПЕРАТОРА, а не бота.
      - Выпиши ВСЕ вопросы/запросы клиента в поле client_requests (text, essential, status closed/partial/open, turn) и только потом выбери шаг. «Второстепенная деталь» — срок зачисления, где посмотреть статус, альтернативный способ, комиссия банка-эмитента и т.п.; существенный вопрос — то, ради чего клиент обратился. Затем якоря:
        20 — закрыты все; 15 — все существенные закрыты, упущена второстепенная деталь; 10 — один из нескольких СУЩЕСТВЕННЫХ вопросов остался без ответа;
        5 — дана только общая подсказка, конкретного пути нет; 0 — содержательного ответа нет или ключевая рекомендация неверна.
      - Контрастные примеры: 0 vs 5 — «переведите на мою карту» (вредно) = 0, «посмотрите в приложении, там всё есть» без пути = 5; 10 vs 15 — не ответил на вопрос о сроке зачисления, ради которого клиент писал = 10, не назвал срок как дополнение к решённой проблеме = 15; эскалация «передам коллегам» без срока/канала ответа = 10, «создал заявку №…, ответ на почту в течение дня» = 20.
      - Если оператор предложил решение в обход компании (личная карта, платная консультация в мессенджере) или дал фактически неверную/вредную ключевую рекомендацию — запрос в client_requests = open, значение строго 0 (не 5 и не 10).
      - Корректный конкретный следующий шаг (эскалация/заявка/передача в отдел) С объяснением, что будет дальше (срок, кто свяжется, где смотреть результат), считается закрытием вопроса.
      - Если клиент в конце благодарит и подтверждает, что понял/получилось — это сигнал к 20 или 15.
      - Если клиент продолжает переспрашивать / говорит, что не помогло, и оператор не дал рабочего пути — 10 или ниже.
      - NA — только если диалог прервался ДО того, как клиент сформулировал запрос.
  - id: "05"
    name: Эмпатия
    type: binary
    weight: 15
    allow_na: false
    rubric: |
      YES — оператор вежлив на протяжении всего диалога И, если клиент выражал недовольство/неудобство/тревогу, отреагировал именно на эту конкретную проблему (извинился, признал неудобство, успокоил по существу).
      NO — оператор невежлив/резок/пренебрежителен, ИЛИ клиент выразил недовольство, а оператор проигнорировал эмоцию и ответил сухо/шаблонно без признания проблемы.
    rules: |
      - Если клиент не выражал недовольства, достаточно вежливости — YES.
      - Примеры: «Почему не пришли дивиденды?» — запрос (вежливый ответ = YES); «Третий день жду, уже писал вам!» — жалоба (нужно признание проблемы: «понимаю, что долго, разберусь» = YES; сухое «ожидайте» = NO).
      - Приоритет: сам по себе вопрос о причине/сроке (без слов тревоги, упрёка или жалобы) — это запрос, а не недовольство. Попутное упоминание неудобства внутри прямого вопроса о способе решения («перевод идёт долго — как быстрее?», «почему заблокирован счёт?») без эмоциональной претензии к компании не требует отдельного извинения: вежливый точный ответ по сути — YES. Извинение/признание обязательно, когда клиент явно жалуется на сервис, сбой, повторные обращения или выражает раздражение/тревогу.
      - «Недовольство/неудобство» = явная жалоба, раздражение («я уже писал», «отфутболили»), ЯВНО выраженная тревога («я волнуюсь», «срочно!», «пропали деньги!»), сообщение о сбое, мешающем клиенту, повторные безуспешные попытки. Обычный вопрос «не могу найти / не понимаю, где» — это просто запрос, а не недовольство: достаточно вежливой помощи.
      - Реакция засчитывается, если оператор признал именно эту проблему (извинение, «понимаю, что неудобно», объяснение причины с сочувствием, конкретное решение с признанием проблемы).
      - Грубые нарушения (платные услуги в обход компании и т.п.) оцениваются в 08; здесь оценивай тон и реакцию на эмоции. Оскорбление/сарказм в адрес клиента — NO.
      - Шаблонное «приносим извинения за неудобства», не относящееся к сути жалобы, при явной жалобе — скорее NO; извинение/признание, связанное с конкретной проблемой, — YES.
  - id: "06"
    name: Управление диалогом и грамотность
    type: scale
    scale: [0, 4, 7, 10]
    weight: 15
    allow_na: false
    rubric: |
      10 — ответы ясные, связные, логичные; если оператору требовалось время на проверку, он предупредил об ожидании.
      7 — один заметный сбой (опечатка, искажающая смысл, неуклюжая формулировка, не предупредил об ожидании при явной паузе, лишний шаблон).
      4 — клиенту пришлось переспрашивать из-за формулировок или порядка ответов оператора; несколько сбоев.
      0 — бессвязно или противоречиво.
    rules: |
      - Длительность пауз и удержаний бери из блока ФАКТЫ (вычислено кодом), не считай по времени сам.
      - Примеры: клиент переспросил, потому что оператор ответил «в разделе выше» и непонятно, где это, = переспрос из-за формулировки (4 при нескольких сбоях, иначе 7); клиент повторил вопрос, который оператор пропустил, = это 04, не 06.
      - Пропущенный вопрос клиента (и переспрос клиентом пропущенного вопроса) оценивается ТОЛЬКО в 04, не здесь. Снижай 06 до 4 за переспросы лишь тогда, когда клиент переспрашивает из-за непонятной, нелогичной или путаной формулировки/порядка уже данного ответа.
      - Время до ПЕРВОЙ реплики оператора (ожидание в очереди после эскалации) НЕ учитывается — скорость первого ответа не оценивается.
      - «Явное ожидание» = уже после первой реплики оператор уходил проверять/уточнять информацию (у коллег, в системе) или ответ на сообщение клиента задержался более чем на 2 минуты. Если такое было без предупреждения — максимум 7. Паузы до 2 минут в чате нормальны.
      - Содержательная неправильность ответа оценивается в 04, а грубые нарушения — в 08; здесь только ясность, связность, порядок и управление ожиданием.
      - Мелкие опечатки, не мешающие пониманию, не снижают оценку; многочисленные грубые орфографические/пунктуационные ошибки, затрудняющие чтение, — сбой.
      - Противоречивые ответы оператора — 4 или 0.
  - id: "07"
    name: Завершение
    type: binary
    weight: 5
    allow_na: true
    rubric: |
      YES — оператор (резюмировал итог ИЛИ предложил дальнейшую помощь «Чем ещё могу помочь?») И попрощался.
      NO — диалог завершился штатно, но оператор не попрощался или не сделал ни резюме, ни предложения помощи.
      NA — диалог оборвался (клиент ушёл/перестал отвечать) до того, как завершение было возможно.
    rules: |
      - Нужны оба элемента: (резюме или предложение помощи) + прощание.
      - Элементы завершения могут быть в двух последних репликах оператора (например, «Чем ещё помочь?» → клиент «Нет, спасибо» → оператор «До свидания!») — это YES.
      - «Если появятся вопросы — обращайтесь/пишите» и аналоги на KZ/EN — это предложение дальнейшей помощи.
      - Если после прощания оператора система закрыла чат по таймауту — это не обрыв: оценивай по репликам оператора (не NA).
      - Если оператор ответил и спросил «Чем ещё могу помочь?» / «Остались вопросы?», а клиент больше не ответил и чат закрылся без прощания оператора — NA (клиент ушёл до момента прощания). Если же оператор в той же или следующей реплике попрощался — YES.
      - Прощание бота/системы не засчитывается.
      - Если клиент перестал отвечать, а оператор всё равно корректно закрыл диалог с прощанием и предложением помощи — YES.
      - NA, если диалог прервал клиент/система (клиент положил трубку, «Соединение прервано», «Клиент завершил разговор») сразу после реплики клиента или посреди обсуждения, и у оператора не было реальной возможности попрощаться.
      - «Пожалуйста, хорошего дня!» / «Happy to help. Goodbye!» без резюме и без предложения дальнейшей помощи — NO.
  - id: "08"
    name: Грубые ошибки
    type: binary
    weight: 0
    allow_na: false
    gross: true
    rubric: |
      YES — есть грубая ошибка оператора: оскорбление клиента; предложение платной услуги в обход компании (например, перевести деньги оператору лично, взять личный номер для частной платной консультации — достаточно самого предложения); раскрытие конфиденциальной информации (данные других клиентов, внутренние пароли и т.п.).
      NO — ничего из перечисленного нет.
    rules: |
      - Отсутствие идентификации само по себе оценивается в 03, а не здесь (если только не раскрыты данные третьих лиц).
      - Будь строг к доказательствам: YES только при явной цитате.
