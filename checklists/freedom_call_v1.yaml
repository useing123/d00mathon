id: freedom_call_v1
name: Freedom Broker — голосовой звонок v1
channel: call
description: |
  Оценка работы ОПЕРАТОРА в звонке. Транскрипт — шумный ASR: игнорируй ошибки распознавания, не наказывай за них оператора.
  IVR-бот не оценивается. Реплики operator во время удержания/консультации с другим агентом (между «Инициирована консультация»/«Клиент на удержании» и «Клиент больше не находится на удержании») — внутренние переговоры, клиент их не слышит: не оценивай их как общение с клиентом.
extends: freedom_chat_v1   # criteria 01–05, 07, 08 and assumptions are inherited from the chat checklist
criteria_overrides:        # merged into the inherited criteria by id — only 06 differs for calls
  - id: '06'
    rubric: |
      10 — ответы ясные, связные, логичные; если оператору требовалось время на проверку, он предупредил об ожидании.
      7 — один заметный сбой (неуклюжая или двусмысленная формулировка, не предупредил об удержании/паузе, лишний шаблон).
      4 — клиенту пришлось переспрашивать из-за формулировок или порядка ответов оператора; несколько сбоев.
      0 — бессвязно или противоречиво.
    rules: |
      - Длительность пауз и удержаний бери из блока ФАКТЫ (вычислено кодом), не считай по времени сам. Если там есть хотя бы одно ожидание > 2 мин БЕЗ предупреждения — максимум 7 (пауза между сообщениями оператора, когда клиент ничего не ждал, сама по себе не сбой, если оператор затем продолжил по делу).
      - Примеры: клиент переспросил, потому что оператор ответил «в разделе выше» и непонятно, где это, = переспрос из-за формулировки (4 при нескольких сбоях, иначе 7); клиент повторил вопрос, который оператор пропустил, = это 04, не 06.
      - Пропущенный вопрос клиента (и переспрос клиентом пропущенного вопроса) оценивается ТОЛЬКО в 04, не здесь. Снижай 06 до 4 за переспросы лишь тогда, когда клиент переспрашивает из-за непонятной, нелогичной или путаной формулировки/порядка уже данного ответа.
      - Время до ПЕРВОЙ реплики оператора (ожидание в очереди после эскалации) НЕ учитывается — скорость первого ответа не оценивается.
      - «Явное ожидание» = уже после первой реплики оператор уходил проверять/уточнять информацию (у коллег, в системе) или ответ на сообщение клиента задержался более чем на 2 минуты. Если такое было без предупреждения — максимум 7. Короткие паузы без удержания нормальны; при постановке на удержание или паузе более 2 минут оператор должен предупредить клиента.
      - Содержательная неправильность ответа оценивается в 04, а грубые нарушения — в 08; здесь только ясность, связность, порядок и управление ожиданием.
      - Для звонков: оценивай логику, ясность, отсутствие неуместных выражений и управление паузами (предупредил о постановке на удержание, поблагодарил за ожидание). Ошибки ASR не учитываются.
      - Противоречивые ответы оператора — 4 или 0.
