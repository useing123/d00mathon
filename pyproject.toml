[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cqa"
version = "1.0.0"
description = "Chat Quality Assessment: per-criterion LLM jury that scores operator chats & calls against a flexible checklist"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "CQA team" }]
keywords = ["llm", "quality-assurance", "contact-center", "llm-as-a-judge", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Framework :: FastAPI",
]
dependencies = [
  "anthropic>=0.40",
  "fastapi",
  "uvicorn",
  "httpx",
  "pyyaml",
  "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
cqa = "cqa.__main__:main"

[tool.setuptools]
packages = ["cqa"]

[tool.setuptools.package-data]
cqa = ["static/*"]   # index.html, app.js, app.css

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "B008",  # FastAPI Body()/File() defaults are idiomatic
  "E401",  # `from . import a, b` style
  "E731",
]

[tool.ruff.lint.per-file-ignores]
"cqa/prompts.py" = ["E501"]  # natural-language prompt text

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true
