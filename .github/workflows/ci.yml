name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      CQA_PROVIDER: mock   # offline deterministic backend: no API key in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: python -m pytest -q
      - name: CLI smoke (mock, synthetic data)
        run: python -m cqa evaluate --mock --fresh --input examples/sample_dialogs.json --group DEMO
      - name: Gold-set pipeline smoke (mock; plumbing, not accuracy)
        run: python -m cqa gold --mock --fresh
